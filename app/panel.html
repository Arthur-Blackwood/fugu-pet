<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fugu Pet</title>
  </head>
  <body>
    <main class="card" id="card">
      <header class="bar">
        <nav class="tabs" role="tablist" aria-label="Panel sections">
          <button role="tab" data-view="belly" aria-selected="true">Belly</button>
          <button role="tab" data-view="recent" aria-selected="false">Recent</button>
          <button role="tab" data-view="tidy" aria-selected="false">Tidy</button>
          <button role="tab" data-view="settings" aria-selected="false" class="tab-icon" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2" /><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" /></svg>
          </button>
        </nav>
        <span class="grow"></span>
        <button class="play-btn" id="play" type="button" title="Play mode: click to make the fish swim, double-click Desktop files to feed it">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.5v9l7-4.5z" /></svg>Play
        </button>
        <button class="icon-btn" id="close" aria-label="Close panel" title="Close (Esc)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" /></svg>
        </button>
      </header>
      <section class="body" id="body" aria-live="polite"></section>
      <footer class="foot" id="foot"></footer>
    </main>
    <script type="module" src="/src/panel/main.ts"></script>
  </body>
</html>
